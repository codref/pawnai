# DeepSeek V4.1 Flash on OpenRouter (deepseek/deepseek-v4.1-flash).
#
# 1,048,576-token context. Thinking is on by default and shares the output
# cap with the visible reply, so a non-streaming agent turn looks stuck
# until the whole trace finishes. think: low keeps a short trace (about a
# fifth of the output cap) so the reply is better without a multi-minute wait.
# The composer can raise it to medium or high, or turn it off.
#
#   openrouter:
#     base_url: https://openrouter.ai/api/v1
#     api_key: sk-or-...
#     user_agent: pawn/1.0
#     models:
#       - profile: deepseek-v4.1-flash.yaml
#
# Selectable id: openrouter@deepseek/deepseek-v4.1-flash
schema_version: 1
target_model: deepseek/deepseek-v4.1-flash
instructions:
  controller: ""
  extractor: ""
  ingest: ""
  converse: |
    Reasoning stays internal. The visible reply is plain text, or one
    ```run block when a tool is required. Do not explain the command
    before the block, and do not wrap the tool call in prose.
  rewriter: ""
demonstrations:
  controller: ""
  extractor: ""
  ingest: ""
  converse: ""
  rewriter: ""
budgets:
  # 256k of the 1M window: long transcripts and notes, not the whole context.
  prompt_budget: 262144
  max_output_tokens: 8192
  recent_history_tokens: 65536
  retrieval_tokens: 32768
  control_max_tokens: 1024
  extract_max_tokens: 4096
  instruction_tokens: 4000
  demo_tokens: 2000
  temperature: 0.4
  think: low
metadata:
  note: "OpenRouter DeepSeek V4.1 Flash. Reasoning on at low effort; the composer can change it."
  version: deepseek-v4.1-flash-v1
  context_window: 1048576
  max_output: 384000
