# Paste inside the `server { listen 4000 ssl; ... }` block,
# BEFORE the existing `location /` that proxies to :4001.
#
# Apply:
#   sudo cp /etc/nginx/nginx.conf /etc/nginx/nginx.conf.bak.$(date +%Y%m%d)
#   # edit /etc/nginx/nginx.conf to insert the block below
#   sudo nginx -t && sudo systemctl reload nginx
#
# Or merge automatically from the repo root:
#   sudo python3 deploy/apply_nginx_pawn_location.py

# pawn-server — keep uvicorn on 127.0.0.1:8000 only
location ^~ /pawn/ {
    proxy_pass http://127.0.0.1:8000/;
    proxy_http_version 1.1;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-Host $host:$server_port;
    proxy_set_header Authorization $http_authorization;

    # chat streaming + long agent turns
    proxy_buffering off;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    client_max_body_size 100m;
}
