services:
  postgres:
    image: pgvector/pgvector:pg17
    container_name: pawn-diarize-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: pawnai
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d pawnai"]
      interval: 5s
      timeout: 5s
      retries: 6
      start_period: 10s

  litellm:
    build:
      context: ..
      dockerfile: docker/litellm/Dockerfile
    ports:
      - "4000:4000"
    environment:
      - LITELLM_MASTER_KEY=${LITELLM_MASTER_KEY:-}
    restart: unless-stopped

  adminer:
    image: adminer:latest
    depends_on:
      - postgres
    ports:
      - "8081:8080"

  phoenix:
    image: arizephoenix/phoenix:latest
    container_name: phoenix
    restart: unless-stopped
    environment:
      PHOENIX_WORKING_DIR: /mnt/data
    ports:
      - "6006:6006"
      - "4317:4317"
    volumes:
      - phoenix_data:/mnt/data

volumes:
  pgdata:
    driver: local
  phoenix_data:
    driver: local
